name: ScalpScan Alertas
on:  schedule:    # Cada 15 minutos. GitHub Actions puede retrasarse unos minutos    # en horas de mucha carga, es normal.    - cron: '*/15 * * * *'  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña "Actions"
jobs:  scan:    runs-on: ubuntu-latest    steps:      - name: Checkout repo        uses: actions/checkout@v4
      - name: Setup Node        uses: actions/setup-node@v4        with:          node-version: '20'
      - name: Run scanner        env:          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}        run: node scan.js
